<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokémon Chant & Festin — Kanto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#231a4a;--ink:#1a1240;--red:#d6473a;--yel:#f7d35a;--brn:#6b4c28;--soft:#f8f7ff;--mut:#6c6694;--ok:#4caf50;--mid:#f5a524;--low:#e5483c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.35 'Baloo 2',system-ui,sans-serif;padding:max(10px,env(safe-area-inset-top)) 12px calc(40px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
.panel{display:none}.panel.on{display:block}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 #0e0a26;padding:12px;margin-bottom:14px}
.state{background:var(--brn);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.18);border-radius:99px;padding:3px 12px;font-weight:800;font-size:14px}
.state h1{margin:10px 2px 6px;font-size:26px;line-height:1.1}
.lieu{display:inline-block;background:var(--yel);color:var(--ink);border:3px solid var(--ink);border-radius:99px;padding:4px 14px;font-weight:800}
h2{color:#fff;font-size:18px;margin:4px 4px 8px;text-shadow:0 2px 0 var(--ink)}
.arena{position:relative;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 #0e0a26;margin-bottom:14px;overflow:hidden;background:linear-gradient(#9fd8ff 0 46%,#86c95a 46%);padding:10px}
#anim{position:fixed;inset:0;background:rgba(14,10,38,.94);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px}
#anim[hidden]{display:none}
#anim-stage{min-height:185px;display:flex;align-items:center;justify-content:center}
#anim-stage.flash{animation:aflash .5s ease}
@keyframes aflash{0%{filter:brightness(1)}30%{filter:brightness(3.4)}100%{filter:brightness(1)}}
.anim-egg{font-size:110px;line-height:1}
.anim-egg.wiggle{animation:wig .5s ease-in-out 4}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.anim-sprite{width:170px;height:170px;image-rendering:pixelated;animation:pop .45s ease}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.silh{filter:brightness(0) invert(1)}
#anim-txt{color:#fff;font-size:20px;font-weight:800;text-align:center}
#anim-x{background:var(--yel);border:3px solid var(--ink);border-radius:99px;padding:8px 22px;font:inherit;font-weight:800;cursor:pointer;color:var(--ink)}
.dice{transition:opacity .6s ease,transform .6s ease}
.dice.gone{opacity:0;transform:scale(.96)}
.mapsvg{width:100%;height:auto;display:block}
.pulse{animation:pl 1.6s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.95}50%{opacity:.25}}
.mapleg{font-weight:800;color:var(--mut);font-size:13px;margin-top:6px;text-align:center}
#deco{position:absolute;top:6px;right:12px;font-size:30px;letter-spacing:6px;opacity:.85;pointer-events:none;z-index:0}
.arena .row{position:relative;z-index:1}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;min-height:150px}
.sprite{width:104px;height:104px;object-fit:contain;image-rendering:pixelated;position:relative;z-index:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.slot::after{content:"";position:absolute;bottom:34px;width:110px;height:20px;border-radius:50%;background:rgba(0,0,0,.18)}
.slot.foe::after{bottom:auto;top:98px;width:90px;height:14px}
.noimg{width:104px;height:104px;display:grid;place-items:center;font-size:44px;position:relative;z-index:1}
.hpbox{width:100%;background:var(--soft);border:3px solid var(--ink);border-radius:14px;padding:5px 8px;position:relative;z-index:2}
.hpbox .n{display:flex;justify-content:space-between;gap:4px;font-weight:800;font-size:14px}
.hpbox .n small{color:var(--mut);font-weight:700}
.bar{height:11px;background:#d9d6ee;border:2px solid var(--ink);border-radius:99px;overflow:hidden;margin:3px 0}
.fill{height:100%;transition:width .7s ease,background .4s}
.pv{font-size:12px;color:var(--mut);font-weight:700}
.st{display:inline-block;font-size:11px;font-weight:800;border:2px solid var(--ink);border-radius:99px;padding:0 7px;margin:2px 3px 0 0;background:#e6e1ff}
.own{font-size:11px;font-weight:800;color:var(--red)}
.hit{animation:hit .45s}
@keyframes hit{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.ann{display:grid;gap:8px}
.ann div{background:var(--soft);border:2px solid #e2defa;border-radius:14px;padding:8px 10px}
.ann b{color:var(--red)}
.vide{color:var(--mut);padding:4px}
.team{display:flex;gap:10px;align-items:center;background:var(--soft);border:3px solid var(--ink);border-radius:16px;padding:8px;margin-top:10px}
.team .sprite,.team .noimg{width:72px;height:72px;font-size:32px}
.team .info{flex:1}
.badge{font-size:12px;font-weight:800;border-radius:99px;padding:1px 10px;border:2px solid var(--ink);margin-left:6px}
.b-on{background:#7ddc7a}.b-off{background:#c9c4ee}
.jh{background:var(--brn);color:#fff;border-radius:12px;padding:6px 12px;font-weight:800}

.device{background:var(--red);border:4px solid var(--ink);border-radius:28px 28px 24px 24px;box-shadow:0 8px 0 #0e0a26,inset 0 0 0 3px #ef6a5c;padding:12px}
.head{display:flex;align-items:center;gap:8px;padding:2px 4px 12px;border-bottom:4px solid var(--ink);margin-bottom:12px}
.lens{width:58px;height:58px;border-radius:50%;flex:none;border:4px solid #fff;box-shadow:0 0 0 4px var(--ink);background:radial-gradient(circle at 32% 28%,#fff 0 7%,#9fe3ff 8% 28%,#2c8be0 62%,#1262b5)}
.led{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);display:inline-block;flex:none}
.led.r{background:#ff8b7d}.led.y{background:var(--yel)}.led.g{background:#7ddc7a}
.brand{margin-left:auto;text-align:right;color:#fff;font-weight:800;font-size:20px;line-height:1;text-shadow:0 2px 0 var(--ink);letter-spacing:.04em}
.brand small{display:block;font-size:11px;letter-spacing:0;margin-top:4px;font-weight:700}
.bezel{background:#e9e6f5;border:4px solid var(--ink);border-radius:16px 16px 16px 44px;padding:10px 12px 16px;box-shadow:inset 0 -4px 0 #c9c4ee}
.dots{display:flex;gap:6px;margin:0 0 8px 4px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--ink)}
.screen{background:var(--bg);border:4px solid var(--ink);border-radius:10px;padding:10px;min-height:440px;box-shadow:inset 0 0 0 3px #3a2f7a}
.ctrl{margin-top:12px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{min-width:0;border:3px solid var(--ink);background:#fff;font:inherit;font-size:15.5px;font-weight:800;color:var(--ink);padding:9px 2px;border-radius:14px;box-shadow:0 4px 0 #0e0a26;text-align:center;white-space:nowrap;overflow:hidden}
.tab:active{transform:translateY(3px);box-shadow:0 1px 0 #0e0a26}
.tab.on{background:var(--yel)}
.deco{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:0 6px}
.dpad{width:56px;height:56px;position:relative}
.dpad::before,.dpad::after{content:"";position:absolute;background:var(--ink);border-radius:5px}
.dpad::before{left:0;right:0;top:19px;height:18px}.dpad::after{top:0;bottom:0;left:19px;width:18px}
.stat{font-size:12px;font-weight:800;color:#fff;background:var(--ink);border-radius:99px;padding:3px 12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--low);margin-right:6px}.dot.on{background:#7ddc7a}
.slits{display:flex;gap:6px;transform:rotate(-20deg)}.slits i{width:6px;height:34px;border-radius:4px;background:var(--ink)}
.dice{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin:10px 0}
.dw{text-align:center}
.die{position:relative;width:68px;height:68px;margin:0 auto;cursor:pointer;background:var(--ink);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.die::before{content:"";position:absolute;inset:4px;background:linear-gradient(#e5483c 0 43%,var(--ink) 43% 57%,#fff 57%);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.face{position:absolute;inset:0;display:grid;place-items:center;z-index:1}
.face span{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:15px}
.die.roll{animation:spin .8s ease-out}@keyframes spin{to{transform:rotate(720deg)}}
.die.crit::before{background:linear-gradient(#f7d35a 0 43%,var(--ink) 43% 57%,#fff6c2 57%)}
.die.fumble{filter:grayscale(1)}
.cap{font-size:12px;font-weight:800;line-height:1.1;margin-top:4px}
.res{font-size:11px;color:var(--mut)}
.go{border:3px solid var(--ink);background:var(--yel);font:inherit;font-weight:800;border-radius:99px;padding:3px 14px;box-shadow:0 3px 0 #0e0a26}
.flab{display:block;font-weight:800;margin:10px 0 4px}
.fin{width:100%;box-sizing:border-box;border:3px solid var(--ink);border-radius:12px;padding:10px;font:inherit;font-weight:700;background:#fff}
.big{width:100%;margin-top:12px;padding:10px;font-size:17px;cursor:pointer}
.fmsg{margin-top:8px;font-weight:800;min-height:20px}
.pimg{width:100%;height:auto;border:3px solid var(--ink);border-radius:14px;display:block;margin-bottom:8px}
.perso h3{margin:2px 0 4px;font-size:20px}
.perso p{margin:0;color:var(--mut);font-weight:700;font-size:14px;line-height:1.35}

.dress{padding:8px 0;border-bottom:1px dashed var(--border)}
.dress:last-child{border-bottom:none}
.dnom{font-weight:800}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.dchip{background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:2px 9px;font-size:12.5px;font-weight:700}
.ptrait{font-size:12.5px;color:var(--muted);font-style:italic}
.poke{flex-wrap:wrap}
details.atk{flex-basis:100%;margin-top:6px}
details.atk summary{cursor:pointer;font-weight:700;font-size:13.5px;color:var(--accent2)}
.atklist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.atkchip{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:3px 8px;font-size:12.5px}
.atkchip.or{background:#fdf3d8;border-color:#d9a92c;font-weight:700}
.campname{margin:14px 0 8px;font-size:16px}
.pmeta{color:var(--muted);font-size:13px;font-weight:700}
#rech-persos{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:15px;margin-bottom:6px}
.objcat{font-weight:800;margin:10px 0 4px}
.objligne{padding:3px 0;border-bottom:1px dashed var(--border)}
.objligne:last-child{border-bottom:none}
.objligne.fait{opacity:.55;text-decoration:line-through}
.acc{margin:6px 0;border:1px solid var(--border);border-radius:10px;padding:4px 10px}
.acc summary{cursor:pointer;font-weight:800;padding:4px 0}
.acc .objligne:last-child{border-bottom:none}
.iimg{width:30px;height:30px;object-fit:contain;vertical-align:-9px;margin-right:6px}
.acc2{margin:8px 0;border:1px solid var(--border);border-radius:12px;padding:6px 12px}
.acc2 summary{cursor:pointer;padding:6px 0}
.acc2 .campname{font-weight:800;font-size:17px}
.acc2 .prev{display:block;font-size:13px;opacity:.7;margin-top:2px}
.mapwrap{position:relative;border-radius:14px;overflow:hidden;border:2px solid #241f4e;background:#3a7bd5}
.mapimg{display:block;width:100%}
.mapwrap .pin{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:2px solid #241f4e;background:#ffffff;font-size:17px;line-height:1;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.mapwrap .pin.petit{width:27px;height:27px;font-size:13px}
.mapwrap .pin.avenir{opacity:.45;filter:grayscale(.7)}
.mapwrap .pin.ici{box-shadow:0 0 0 3px #e63946;animation:pinpulse 1.6s infinite;z-index:2}
@keyframes pinpulse{0%{box-shadow:0 0 0 2px #e63946}50%{box-shadow:0 0 0 7px rgba(230,57,70,.45)}100%{box-shadow:0 0 0 2px #e63946}}
#btn-son{width:48px;height:48px;flex:none;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 0 #0e0a26;padding:0}
#btn-son.on{background:var(--yel)}
.anim-egg svg{width:112px;height:auto;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
html,body{overflow-x:hidden}
.mapwrap{box-sizing:border-box}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,16px);background:var(--ink);color:#fff;font-weight:800;padding:10px 18px;border-radius:99px;border:3px solid var(--yel);opacity:0;pointer-events:none;transition:.3s;z-index:70;max-width:88vw;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ann-st{display:inline-block;margin-left:8px;font-size:12px;font-weight:800;background:var(--yel);border:2px solid var(--ink);border-radius:99px;padding:1px 8px;vertical-align:middle}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.dexcell{background:#f6f4ff;border:2px solid var(--ink);border-radius:12px;padding:6px 4px;text-align:center}
.dexcell img{width:64px;height:64px;image-rendering:pixelated}
.dexcell.miss img{filter:brightness(0);opacity:.3}
.dexnom{font-weight:800;font-size:13px;line-height:1.15}
.dexnum{font-size:11px;color:#6b6590}
#errbox{background:#e5484d;color:#fff;font-weight:800;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;margin:0 0 10px;box-shadow:0 4px 0 #0e0a26}
.hpfill{height:100%;border-radius:99px;background:var(--ok);transition:width .4s}
.hpfill.mid{background:var(--mid)}
.hpfill.low{background:var(--low)}
.hp{min-width:92px}
.hpbar{height:10px;background:#e3def5;border:2px solid var(--ink);border-radius:99px;overflow:hidden}
.hptext{font-size:12px;font-weight:800;margin-top:2px}
</style>

<body>
<div class="wrap"><div class="device">
  <div class="head"><div class="lens"></div><i class="led r"></i><i class="led y"></i><i class="led g"></i>
    <div class="brand">POKÉDEX<small>Pokémon Chant & Festin · Kanto</small></div></div>
  <div class="bezel"><div class="dots"><i></i><i></i></div><div class="screen">
    <section class="panel on" id="p-jouer">
        <div id="errbox" hidden></div>
      <div class="card state">
        <div class="chips"><span class="chip" id="c-tour">Tour —</span><span class="chip" id="c-heure">⏰ —</span><span class="chip" id="c-jour">Jour —</span><span class="chip" id="c-meteo" hidden></span></div>
        <h1 id="phase">…</h1>
        <span class="lieu" id="lieu" hidden></span>
      </div>
      <h2>⚔️ Le combat</h2>
      <div class="arena"><div id="deco"></div><div class="row" id="foes"></div><div class="row" id="allies"></div></div>
      <h2>📣 Annonces du tour</h2>
      <div class="card"><div class="ann" id="annonces"></div></div>
      <h2>📜 Dernier résultat</h2>
      <div class="card" id="lastres"><div class="vide">Aucun résultat pour l’instant.</div></div>
      <div class="card">
        <h2>✍️ Écrire mon annonce</h2>
        <label class="flab" for="f-joueur">Je suis</label>
        <select id="f-joueur" class="fin"><option>Axel</option><option>Julien</option></select>
        <label class="flab" for="f-texte">Mon annonce</label>
        <textarea id="f-texte" class="fin" rows="3" placeholder="Ex : Mélodie : Écras'Face sur le Magnéti de Bob !"></textarea>
        <button id="f-send" class="go big">📣 Envoyer l’annonce</button>
        <div id="f-msg" class="fmsg"></div>
      </div>
    </section>
    <section class="panel" id="p-equipes"><div id="equipes"></div></section>
    <section class="panel" id="p-journal"><div id="journal"></div></section>
    <section class="panel" id="p-persos"><input id="rech-persos" type="search" placeholder="🔎 Rechercher un personnage…"><div id="persos"></div></section>
    <section class="panel" id="p-carte">
      <div class="card">
        <h2>🗺️ Carte de Kanto</h2>
        <div id="carte"></div>
        <div class="mapleg">🟡 Déjà visité · 🔴 Vous êtes ici · ⚪ À venir</div>
        <div class="mapleg" id="carte-lieu"></div>
      </div>
    </section>
    <section class="panel" id="p-sac"><div id="sac"></div></section>
    <section class="panel" id="p-dex"><div id="dex"></div></section>
    <section class="panel" id="p-quetes"><div id="quetes"></div></section>
  </div></div>
  <div class="ctrl">
    <div class="tabs">
      <button class="tab on" data-t="jouer">Jouer</button>
      <button class="tab" data-t="equipes">Équipes</button>
      <button class="tab" data-t="journal">Journal</button>
      <button class="tab" data-t="persos">Persos</button>
      <button class="tab" data-t="carte">Carte</button>
      <button class="tab" data-t="sac">Sac</button>
      <button class="tab" data-t="quetes">Quêtes</button>
      <button class="tab" data-t="dex">Dex</button>
    </div>
    <div class="deco"><div class="dpad"></div><div class="stat"><span class="dot" id="dot"></span><span id="conn">connexion…</span></div><button id="btn-son" title="Musique">🔇</button><div class="slits"><i></i><i></i><i></i></div></div>
  </div>
</div></div>

<div id="anim" hidden><div id="anim-stage"></div><div id="anim-txt"></div><button id="anim-x" type="button">Continuer</button></div>
<script>
const SUPABASE_URL='https://kybylakwlqwsmbyawjlu.supabase.co';
const SUPABASE_KEY='sb_publishable_jQDj0u0fcMavgsp0MDI7lg_witetarV';

function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function dexId(p){if(p.dex_id)return p.dex_id;const e=String(p.espece||'').trim();return /^\d+$/.test(e)?+e:DEX[norm(e)]||DEX[norm(p.nom)]||null}

function sprite(p,back){

  img.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/'+(back?'back/':'')+id+'.png';

function col(v){return v>50?'var(--ok)':v>25?'var(--mid)':'var(--low)'}

function hpbox(p,owner){

  const bar=el('div','bar'),f=el('div','fill'),v=pct(p),old=prev[p.id];
  f.style.width=(old===undefined?v:old)+'%';f.style.background=col(v);bar.append(f);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.width=v+'%'}));
  if(owner)b.append(el('div','own',owner));
  b.append(n,bar,el('div','pv',p.pv_actuel+' / '+p.pv_max+' PV'));
  statuts(p,b);

}
function slot(p,foe){
  const s=el('div','slot'+(foe?' foe':'')),sp=sprite(p,!foe),o=prev[p.id];
  if(o!==undefined&&pct(p)<o)sp.classList.add('hit');
  const hb=hpbox(p,foe?'':p.proprietaire);
  if(foe)s.append(hb,sp);else s.append(sp,hb);
  return s;
}

function typeObjet(n){
  const s=(n||'').toLowerCase();
  if(/scell/.test(s))return '🔑 Objets clés';
  if(/potion|soin|miel|baie|antidote|réveil|rappel|bandage/.test(s))return '💊 Soins';
  if(/ball/.test(s))return '⚪ Balls';
  if(/(^|\s)ct(\s|$)/.test(s))return '💿 CT';
  if(/fossile|pierre|éclat|rivet|lettre|masque|cape|pendentif|clé|carte|photo|carnet|page|badge/.test(s))return '🔑 Objets clés';
  if(/conserve|nourriture|repas|pain|fromage|gâteau/.test(s))return '🍱 Nourriture';
  return '🎒 Divers';
}

  if(s.includes('grotte')||s.includes('mont')||s.includes('sélénite')||s.includes('selenite'))return 'grotte';
  if(s.includes('port')||s.includes('quai')||s.includes('océane')||s.includes('oceane')||s.includes('bateau'))return 'port';

function dieEl(key,x){

}

function freqMus(m){return 440*Math.pow(2,(m-69)/12)}
function beepMus(f,type,dur,vol){
  if(!MUS.ctx)return;
  const t=MUS.ctx.currentTime,o=MUS.ctx.createOscillator(),g=MUS.ctx.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(MUS.gain);o.start(t);o.stop(t+dur+.02);
}
function boucleMus(){
  const tr=TRACKS[MUS.track]||TRACKS.plaine;
  const s=MUS.step%tr.lead.length,n=tr.lead[s];
  if(n)beepMus(freqMus(n),'square',.16,.04);
  if(s%2===0){const b=tr.bass[(s>>1)%tr.bass.length];if(b)beepMus(freqMus(b),'triangle',.3,.06)}
  MUS.step++;
  MUS.timer=setTimeout(boucleMus,30000/tr.tempo);
}

function sonPokedex(){if(!AC||!sonOn)return;const t0=AC.currentTime+0.02;
  const bip=(f,t,d,v)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(v||0.09,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.03)};
  const o=AC.createOscillator(),g=AC.createGain();o.type='sawtooth';o.frequency.setValueAtTime(480,t0);o.frequency.exponentialRampToValueAtTime(1450,t0+0.15);g.gain.setValueAtTime(0.045,t0);g.gain.exponentialRampToValueAtTime(0.001,t0+0.17);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+0.19);
  bip(1318,t0+0.20,0.07);bip(1318,t0+0.32,0.07);bip(1046,t0+0.46,0.09);bip(1318,t0+0.58,0.09);bip(1568,t0+0.70,0.18,0.11)}
function toastDex(txt){let t=$('toast');if(!t){t=el('div');t.id='toast';document.body.append(t)}t.textContent=txt;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3400)}
function verifierNouveaux(liste){const especes={};(liste||[]).forEach(p=>{if(p.espece)especes[norm(p.espece)]=p.espece});
  const cles=Object.keys(especes);if(!cles.length)return;
  let vus=null;try{vus=JSON.parse(localStorage.getItem('dexVus')||'null')}catch(e){}
  if(!vus){try{localStorage.setItem('dexVus',JSON.stringify(cles))}catch(e){}return}
  const nouveaux=cles.filter(k=>vus.indexOf(k)<0);
  if(nouveaux.length){try{localStorage.setItem('dexVus',JSON.stringify(vus.concat(nouveaux)))}catch(e){}
    sonPokedex();toastDex('📖 Nouveau Pokémon enregistré : '+nouveaux.map(k=>especes[k]).join(', ')+' !')}}

function majMusique(e){
  if(!e)return;
  let theme='plaine';
  if(advActif)theme='combat';
  else{const f=fondDepuisLieu(e.lieu||'');theme={plaine:'plaine',foret:'foret',port:'port',ville:'ville',grotte:'sombre',tour:'sombre',neige:'ville',volcan:'sombre',arene_elec:'ville'}[f]||'plaine'}
  if(theme!==MUS.track){MUS.track=theme;MUS.step=0}
}
function basculeSon(){
  const b=$('btn-son');if(!b)return;
  if(!MUS.on){
    MUS.on=true;try{localStorage.setItem('son','1')}catch(_){}
    if(!MUS.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(AC){MUS.ctx=new AC();MUS.gain=MUS.ctx.createGain();MUS.gain.gain.value=.6;MUS.gain.connect(MUS.ctx.destination)}}
    if(MUS.ctx){MUS.ctx.resume();if(!MUS.timer)boucleMus()}
    b.textContent='🔊';b.classList.add('on');
  }else{
    MUS.on=false;try{localStorage.setItem('son','0')}catch(_){}
    if(MUS.timer){clearTimeout(MUS.timer);MUS.timer=null}
    if(MUS.ctx)MUS.ctx.suspend();
    b.textContent='🔇';b.classList.remove('on');
  }
}
