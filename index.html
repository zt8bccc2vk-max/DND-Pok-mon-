<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanto — État de la partie</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#0f1220;--card:#1a1f33;--line:#2a3050;--tx:#e8eaf3;--mut:#8b91ab;--ok:#3ecf8e;--mid:#f5a524;--low:#ef4444;--acc:#7c8cff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px 32px}
.wrap{max-width:560px;margin:0 auto}
.banner{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tour{font-size:22px;font-weight:700}
.phase{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--acc);color:#0f1220;font-weight:600}
.sub{color:var(--mut);font-size:14px;margin-top:6px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:18px 4px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.nom{font-weight:700}
.esp{color:var(--mut);font-size:13px}
.bar{height:10px;background:#0b0e1a;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.fill{height:100%;border-radius:99px;transition:width .4s}
.pv{font-size:13px;color:var(--mut)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:99px;background:#3a2340;color:#ffb3d1;margin:4px 4px 0 0}
.vide{color:var(--mut);font-size:14px;padding:4px}
.conn{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 10px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--low);margin-right:6px}
.dot.on{background:var(--ok)}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner">
    <div class="row"><span class="tour" id="tour">Tour —</span><span class="phase" id="phase">…</span></div>
    <div class="sub" id="quand">—</div>
    <div class="sub" id="lieu"></div>
  </div>
  <div id="groupes"></div>
</div>
<div class="conn"><span class="dot" id="dot"></span><span id="conn">connexion…</span></div>

<script>
const SUPABASE_URL = 'https://kybylakwlqwsmbyawjlu.supabase.co';
const SUPABASE_KEY = 'sb_publishable_jQDj0u0fcMavgsp0MDI7lg_witetarV';
const partie = new URLSearchParams(location.search).get('partie') || 'TEST';
const PHASES = {attente_actions:'Attente des actions', resolution:'Résolution', resolu:'Résolu'};
const GROUPES = [['Axel','Axel'],['Julien','Julien'],['Adversaire','Adversaires']];

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

function setConn(ok){
  $('dot').className = 'dot' + (ok ? ' on' : '');
  $('conn').textContent = ok ? 'en direct' : 'hors ligne';
}
function el(tag, cls, txt){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined) e.textContent = txt;
  return e;
}
function couleur(pct){ return pct > 50 ? 'var(--ok)' : pct > 25 ? 'var(--mid)' : 'var(--low)'; }

function renderEtat(e){
  if (!e){ $('tour').textContent = 'Partie introuvable'; $('phase').textContent = partie; return; }
  $('tour').textContent = 'Tour ' + e.tour;
  $('phase').textContent = PHASES[e.phase] || e.phase;
  $('quand').textContent = [e.jour_label, e.horloge].filter(Boolean).join(' · ') || '—';
  $('lieu').textContent = e.lieu ? '📍 ' + e.lieu : '';
}

function carte(p){
  const c = el('div', 'card');
  const t = el('div', 'row');
  t.append(el('span', 'nom', p.nom), el('span', 'esp', [p.espece, 'niv. ' + p.niveau].filter(Boolean).join(' · ')));
  const pct = Math.max(0, Math.min(100, Math.round(100 * p.pv_actuel / Math.max(1, p.pv_max))));
  const bar = el('div', 'bar'), fill = el('div', 'fill');
  fill.style.width = pct + '%'; fill.style.background = couleur(pct);
  bar.append(fill);
  c.append(t, bar, el('div', 'pv', p.pv_actuel + ' / ' + p.pv_max + ' PV'));
  (p.statut || '').split(',').map(s => s.trim()).filter(Boolean).forEach(s => c.append(el('span', 'chip', s)));
  return c;
}

function renderPokemon(liste){
  const zone = $('groupes');
  zone.replaceChildren();
  GROUPES.forEach(([cle, titre]) => {
    const items = liste.filter(p => p.proprietaire === cle);
    zone.append(el('h2', '', titre));
    if (!items.length) zone.append(el('div', 'vide', 'Aucun Pokémon en jeu.'));
    items.forEach(p => zone.append(carte(p)));
  });
}

async function charger(){
  const [e, p] = await Promise.all([
    db.from('etat').select('*').eq('code_partie', partie).maybeSingle(),
    db.from('pokemon').select('*').eq('code_partie', partie).eq('actif', true).order('id')
  ]);
  if (e.error || p.error){ setConn(false); return; }
  setConn(true);
  renderEtat(e.data);
  renderPokemon(p.data || []);
}

charger();
['etat','pokemon'].forEach(table => {
  db.channel('jeu-' + table + '-' + partie)
    .on('postgres_changes', {event:'*', schema:'public', table, filter:'code_partie=eq.' + partie}, charger)
    .subscribe();
});
setInterval(charger, 10000);
</script>
</body>
</html>
