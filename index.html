<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokémon Chant & Festin — Kanto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#231a4a;--ink:#1a1240;--red:#d6473a;--yel:#f7d35a;--brn:#6b4c28;--soft:#f8f7ff;--mut:#6c6694;--ok:#4caf50;--mid:#f5a524;--low:#e5483c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:600 16px/1.35 'Baloo 2',system-ui,sans-serif;padding:max(10px,env(safe-area-inset-top)) 12px calc(40px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
.panel{display:none}.panel.on{display:block}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 #0e0a26;padding:12px;margin-bottom:14px}
.state{background:var(--brn);color:#fff}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.18);border-radius:99px;padding:3px 12px;font-weight:800;font-size:14px}
.state h1{margin:10px 2px 6px;font-size:26px;line-height:1.1}
.lieu{display:inline-block;background:var(--yel);color:var(--ink);border:3px solid var(--ink);border-radius:99px;padding:4px 14px;font-weight:800}
h2{color:#fff;font-size:18px;margin:4px 4px 8px;text-shadow:0 2px 0 var(--ink)}
.arena{border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 #0e0a26;margin-bottom:14px;overflow:hidden;background:linear-gradient(#9fd8ff 0 46%,#86c95a 46%);padding:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.slot{position:relative;display:flex;flex-direction:column;align-items:center;min-height:150px}
.sprite{width:104px;height:104px;object-fit:contain;image-rendering:pixelated;position:relative;z-index:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.18))}
.slot::after{content:"";position:absolute;bottom:34px;width:110px;height:20px;border-radius:50%;background:rgba(0,0,0,.18)}
.slot.foe::after{bottom:auto;top:98px;width:90px;height:14px}
.noimg{width:104px;height:104px;display:grid;place-items:center;font-size:44px;position:relative;z-index:1}
.hpbox{width:100%;background:var(--soft);border:3px solid var(--ink);border-radius:14px;padding:5px 8px;position:relative;z-index:2}
.hpbox .n{display:flex;justify-content:space-between;gap:4px;font-weight:800;font-size:14px}
.hpbox .n small{color:var(--mut);font-weight:700}
.bar{height:11px;background:#d9d6ee;border:2px solid var(--ink);border-radius:99px;overflow:hidden;margin:3px 0}
.fill{height:100%;transition:width .7s ease,background .4s}
.pv{font-size:12px;color:var(--mut);font-weight:700}
.st{display:inline-block;font-size:11px;font-weight:800;border:2px solid var(--ink);border-radius:99px;padding:0 7px;margin:2px 3px 0 0;background:#e6e1ff}
.own{font-size:11px;font-weight:800;color:var(--red)}
.hit{animation:hit .45s}
@keyframes hit{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.ann{display:grid;gap:8px}
.ann div{background:var(--soft);border:2px solid #e2defa;border-radius:14px;padding:8px 10px}
.ann b{color:var(--red)}
.vide{color:var(--mut);padding:4px}
.team{display:flex;gap:10px;align-items:center;background:var(--soft);border:3px solid var(--ink);border-radius:16px;padding:8px;margin-top:10px}
.team .sprite,.team .noimg{width:72px;height:72px;font-size:32px}
.team .info{flex:1}
.badge{font-size:12px;font-weight:800;border-radius:99px;padding:1px 10px;border:2px solid var(--ink);margin-left:6px}
.b-on{background:#7ddc7a}.b-off{background:#c9c4ee}
.jh{background:var(--brn);color:#fff;border-radius:12px;padding:6px 12px;font-weight:800}

.device{background:var(--red);border:4px solid var(--ink);border-radius:28px 28px 24px 24px;box-shadow:0 8px 0 #0e0a26,inset 0 0 0 3px #ef6a5c;padding:12px}
.head{display:flex;align-items:center;gap:8px;padding:2px 4px 12px;border-bottom:4px solid var(--ink);margin-bottom:12px}
.lens{width:58px;height:58px;border-radius:50%;flex:none;border:4px solid #fff;box-shadow:0 0 0 4px var(--ink);background:radial-gradient(circle at 32% 28%,#fff 0 7%,#9fe3ff 8% 28%,#2c8be0 62%,#1262b5)}
.led{width:14px;height:14px;border-radius:50%;border:3px solid var(--ink);display:inline-block;flex:none}
.led.r{background:#ff8b7d}.led.y{background:var(--yel)}.led.g{background:#7ddc7a}
.brand{margin-left:auto;text-align:right;color:#fff;font-weight:800;font-size:20px;line-height:1;text-shadow:0 2px 0 var(--ink);letter-spacing:.04em}
.brand small{display:block;font-size:11px;letter-spacing:0;margin-top:4px;font-weight:700}
.bezel{background:#e9e6f5;border:4px solid var(--ink);border-radius:16px 16px 16px 44px;padding:10px 12px 16px;box-shadow:inset 0 -4px 0 #c9c4ee}
.dots{display:flex;gap:6px;margin:0 0 8px 4px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--ink)}
.screen{background:var(--bg);border:4px solid var(--ink);border-radius:10px;padding:10px;min-height:440px;box-shadow:inset 0 0 0 3px #3a2f7a}
.ctrl{margin-top:12px}
.tabs{display:flex;gap:8px}
.tab{flex:1;border:3px solid var(--ink);background:#fff;font:inherit;font-weight:800;color:var(--ink);padding:8px 4px;border-radius:14px;box-shadow:0 4px 0 #0e0a26}
.tab:active{transform:translateY(3px);box-shadow:0 1px 0 #0e0a26}
.tab.on{background:var(--yel)}
.deco{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:0 6px}
.dpad{width:56px;height:56px;position:relative}
.dpad::before,.dpad::after{content:"";position:absolute;background:var(--ink);border-radius:5px}
.dpad::before{left:0;right:0;top:19px;height:18px}.dpad::after{top:0;bottom:0;left:19px;width:18px}
.stat{font-size:12px;font-weight:800;color:#fff;background:var(--ink);border-radius:99px;padding:3px 12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--low);margin-right:6px}.dot.on{background:#7ddc7a}
.slits{display:flex;gap:6px;transform:rotate(-20deg)}.slits i{width:6px;height:34px;border-radius:4px;background:var(--ink)}
.dice{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin:10px 0}
.dw{text-align:center}
.die{position:relative;width:68px;height:68px;margin:0 auto;cursor:pointer;background:var(--ink);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.die::before{content:"";position:absolute;inset:4px;background:linear-gradient(#e5483c 0 43%,var(--ink) 43% 57%,#fff 57%);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.face{position:absolute;inset:0;display:grid;place-items:center;z-index:1}
.face span{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:15px}
.die.roll{animation:spin .8s ease-out}@keyframes spin{to{transform:rotate(720deg)}}
.die.crit::before{background:linear-gradient(#f7d35a 0 43%,var(--ink) 43% 57%,#fff6c2 57%)}
.die.fumble{filter:grayscale(1)}
.cap{font-size:12px;font-weight:800;line-height:1.1;margin-top:4px}
.res{font-size:11px;color:var(--mut)}
.go{border:3px solid var(--ink);background:var(--yel);font:inherit;font-weight:800;border-radius:99px;padding:3px 14px;box-shadow:0 3px 0 #0e0a26}
.flab{display:block;font-weight:800;margin:10px 0 4px}
.fin{width:100%;box-sizing:border-box;border:3px solid var(--ink);border-radius:12px;padding:10px;font:inherit;font-weight:700;background:#fff}
.big{width:100%;margin-top:12px;padding:10px;font-size:17px;cursor:pointer}
.fmsg{margin-top:8px;font-weight:800;min-height:20px}
.pimg{width:100%;height:auto;border:3px solid var(--ink);border-radius:14px;display:block;margin-bottom:8px}
.perso h3{margin:2px 0 4px;font-size:20px}
.perso p{margin:0;color:var(--mut);font-weight:700;font-size:14px;line-height:1.35}
</style>
</head>
<body>
<div class="wrap"><div class="device">
  <div class="head"><div class="lens"></div><i class="led r"></i><i class="led y"></i><i class="led g"></i>
    <div class="brand">POKÉDEX<small>Pokémon Chant & Festin · Kanto</small></div></div>
  <div class="bezel"><div class="dots"><i></i><i></i></div><div class="screen">
    <section class="panel on" id="p-jouer">
      <div class="card state">
        <div class="chips"><span class="chip" id="c-tour">Tour —</span><span class="chip" id="c-heure">⏰ —</span><span class="chip" id="c-jour">Jour —</span></div>
        <h1 id="phase">…</h1>
        <span class="lieu" id="lieu" hidden></span>
      </div>
      <h2>⚔️ Le combat</h2>
      <div class="arena"><div class="row" id="foes"></div><div class="row" id="allies"></div></div>
      <h2>📣 Annonces du tour</h2>
      <div class="card"><div class="ann" id="annonces"></div></div>
      <div class="card">
        <h2>✍️ Écrire mon annonce</h2>
        <label class="flab" for="f-joueur">Je suis</label>
        <select id="f-joueur" class="fin"><option>Axel</option><option>Julien</option></select>
        <label class="flab" for="f-texte">Mon annonce</label>
        <textarea id="f-texte" class="fin" rows="3" placeholder="Ex : Mélodie : Écras'Face sur le Magnéti de Bob !"></textarea>
        <button id="f-send" class="go big">📣 Envoyer l’annonce</button>
        <div id="f-msg" class="fmsg"></div>
      </div>
    </section>
    <section class="panel" id="p-equipes"><div id="equipes"></div></section>
    <section class="panel" id="p-journal"><div id="journal"></div></section>
    <section class="panel" id="p-persos"><div id="persos"></div></section>
  </div></div>
  <div class="ctrl">
    <div class="tabs">
      <button class="tab on" data-t="jouer">Jouer</button>
      <button class="tab" data-t="equipes">Équipes</button>
      <button class="tab" data-t="journal">Journal</button>
      <button class="tab" data-t="persos">Persos</button>
    </div>
    <div class="deco"><div class="dpad"></div><div class="stat"><span class="dot" id="dot"></span><span id="conn">connexion…</span></div><div class="slits"><i></i><i></i><i></i></div></div>
  </div>
</div></div>

<script>
const SUPABASE_URL='https://kybylakwlqwsmbyawjlu.supabase.co';
const SUPABASE_KEY='sb_publishable_jQDj0u0fcMavgsp0MDI7lg_witetarV';
const partie=new URLSearchParams(location.search).get('partie')||'TEST';
const PHASES={attente_actions:'En attente des actions',resolution:'Résolution en cours',resolu:'Tour résolu'};
const DEX={bulbizarre:1,herbizarre:2,florizarre:3,salameche:4,reptincel:5,dracaufeu:6,carapuce:7,carabaffe:8,tortank:9,chenipan:10,aspicot:13,coconfort:14,dardargnan:15,roucool:16,roucoups:17,rattata:19,rattatac:20,piafabec:21,pikachu:25,raichu:26,melofee:35,melodelfe:36,mystherbe:43,abra:63,kadabra:64,alakazam:65,chetiflor:69,magneti:81,magneton:82,onix:95,voltorbe:100,electrode:101,evoli:133,ronflex:143,goinfrex:446};
const $=id=>document.getElementById(id);
let db=null;
window.addEventListener('error',e=>{const c=document.getElementById('conn');if(c)c.textContent='Erreur : '+(e.message||'inconnue')});
const prev={};

function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function dexId(p){const e=String(p.espece||'').trim();return /^\d+$/.test(e)?+e:DEX[norm(e)]||DEX[norm(p.nom)]||null}
function sprite(p,back){
  const id=dexId(p),box=el('div','noimg','❔');
  if(!id)return box;
  const img=new Image();img.className='sprite';img.alt=p.nom;
  img.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/'+(back?'back/':'')+id+'.png';
  img.onerror=()=>img.replaceWith(box);
  return img;
}
function col(v){return v>50?'var(--ok)':v>25?'var(--mid)':'var(--low)'}
function stColor(s){s=s.toLowerCase();return /poison/.test(s)?'#e0a8f5':/ralent/.test(s)?'#a9c8ff':/endorm|sommeil/.test(s)?'#c7ccd6':/confus/.test(s)?'#ffb3d1':/paraly/.test(s)?'#f7d35a':/br[uû]l/.test(s)?'#ffb27a':'#e6e1ff'}
function pct(p){return Math.max(0,Math.min(100,Math.round(100*p.pv_actuel/Math.max(1,p.pv_max))))}
function statuts(p,into){(p.statut||'').split(',').map(s=>s.trim()).filter(Boolean).forEach(s=>{const c=el('span','st',s);c.style.background=stColor(s);into.append(c)})}

function hpbox(p,owner){
  const b=el('div','hpbox'),n=el('div','n');
  n.append(el('span','',p.nom),el('small','','Niv. '+p.niveau));
  const bar=el('div','bar'),f=el('div','fill'),v=pct(p),old=prev[p.id];
  f.style.width=(old===undefined?v:old)+'%';f.style.background=col(v);bar.append(f);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.width=v+'%'}));
  if(owner)b.append(el('div','own',owner));
  b.append(n,bar,el('div','pv',p.pv_actuel+' / '+p.pv_max+' PV'));
  statuts(p,b);
  return b;
}
function slot(p,foe){
  const s=el('div','slot'+(foe?' foe':'')),sp=sprite(p,!foe),o=prev[p.id];
  if(o!==undefined&&pct(p)<o)sp.classList.add('hit');
  const hb=hpbox(p,foe?'':p.proprietaire);
  if(foe)s.append(hb,sp);else s.append(sp,hb);
  return s;
}
function renderArena(list){
  const act=list.filter(p=>p.actif),F=$('foes'),A=$('allies');
  const foes=act.filter(p=>p.proprietaire==='Adversaire'),al=act.filter(p=>p.proprietaire!=='Adversaire');
  F.replaceChildren();A.replaceChildren();
  foes.forEach(p=>F.append(slot(p,true)));al.forEach(p=>A.append(slot(p,false)));
  if(!foes.length)F.append(el('div','vide','Aucun adversaire en jeu.'));
  if(!al.length)A.append(el('div','vide','Aucun Pokémon allié en jeu.'));
}
function renderEquipes(list){
  const z=$('equipes');z.replaceChildren();
  [['Axel','Axel'],['Julien','Julien'],['Adversaire','Adversaires']].forEach(([k,t])=>{
    const c=el('div','card'),h=el('h3','',t);h.style.margin='0';c.append(h);
    const items=list.filter(p=>p.proprietaire===k);
    if(!items.length)c.append(el('div','vide','Aucun Pokémon enregistré.'));
    items.forEach(p=>{
      const r=el('div','team'),i=el('div','info'),n=el('div','');
      n.append(el('b','',p.nom),el('span','badge '+(p.actif?'b-on':'b-off'),p.actif?'Actif':'En réserve'));
      const bar=el('div','bar'),f=el('div','fill');f.style.width=pct(p)+'%';f.style.background=col(pct(p));bar.append(f);
      i.append(n,el('div','pv',[p.espece,'Niv. '+p.niveau].filter(Boolean).join(' · ')),bar,el('div','pv',p.pv_actuel+' / '+p.pv_max+' PV'));
      statuts(p,i);r.append(sprite(p,false),i);c.append(r);
    });
    z.append(c);
  });
}
function renderEtat(e){
  if(!e){$('phase').textContent='Partie « '+partie+' » introuvable';return}
  $('c-tour').textContent='Tour n°'+e.tour;
  $('c-heure').textContent='⏰ '+(e.horloge||'—');
  $('c-jour').textContent=e.jour_label||'Jour —';
  $('phase').textContent=PHASES[e.phase]||e.phase;
  const l=$('lieu');l.hidden=!e.lieu;l.textContent='📍 '+(e.lieu||'');
}
function renderAnnonces(rows){
  const z=$('annonces');z.replaceChildren();
  ['Axel','Julien'].forEach(j=>{
    const a=rows.filter(r=>r.joueur===j).sort((x,y)=>new Date(y.cree_le)-new Date(x.cree_le))[0];
    const d=el('div','');d.append(el('b','',j+' : '),document.createTextNode(a?a.texte:'pas encore d’annonce…'));z.append(d);
  });
}
let REV;try{REV=new Set(JSON.parse(localStorage.getItem('rev')||'[]'))}catch(e){REV=new Set()}
function saveRev(){try{localStorage.setItem('rev',JSON.stringify([...REV]))}catch(e){}}
function dieEl(key,x){
  const w=el('div','dw'),d=el('div','die'),f=el('div','face'),n=el('span','','?'),res=el('div','res');
  const nat=x.total-(x.mod||0);
  f.append(n);d.append(f);
  const show=()=>{n.textContent=nat;res.textContent=x.de+(x.mod?(x.mod>0?'+':'')+x.mod:'')+' = '+x.total+' → '+x.verdict;
    if(x.de==='d20'&&nat===20)d.classList.add('crit');if(x.de==='d20'&&nat===1)d.classList.add('fumble')};
  if(REV.has(key))show();else res.textContent='Touche pour lancer';
  d.onclick=()=>{
    if(REV.has(key)||d.classList.contains('roll'))return;
    const max=+String(x.de).replace(/\D/g,'')||20;
    d.classList.add('roll');
    const t=setInterval(()=>{n.textContent=1+Math.floor(Math.random()*max)},70);
    setTimeout(()=>{clearInterval(t);d.classList.remove('roll');REV.add(key);saveRev();show()},800);
  };
  w.append(d,el('div','cap',x.label),res);return w;
}
function renderJournal(rows){
  const z=$('journal');z.replaceChildren();
  if(!rows.length){const c=el('div','card');c.append(el('div','vide','Aucun tour résolu pour l’instant.'));z.append(c);return}
  rows.forEach(r=>{
    const c=el('div','card'),dice=el('div','dice'),des=r.des_json||[];
    c.append(el('div','jh','Tour n°'+r.tour+' — résolu par le MJ'));
    des.forEach((x,i)=>dice.append(dieEl(r.id+'-'+i,x)));
    if(des.length){
      const go=el('button','go','🎲 Tout lancer');
      go.onclick=()=>[...dice.querySelectorAll('.die')].forEach((d,k)=>setTimeout(()=>d.click(),k*250));
      c.append(go);
    }
    c.append(dice,el('div','',r.texte_resolution));z.append(c);
  });
}
function renderPersos(rows){
  const z=$('persos');z.replaceChildren();
  if(!rows.length){const c=el('div','card');c.append(el('div','vide','Aucun personnage pour l’instant.'));z.append(c);return}
  rows.forEach(r=>{
    const c=el('div','card perso');
    if(r.image){
      const img=new Image();img.src=r.image;img.alt=r.nom;img.className='pimg';
      img.onerror=()=>{const b=el('div','noimg','❔');b.style.width='100%';b.style.height='180px';b.style.fontSize='60px';img.replaceWith(b)};
      c.append(img);
    }
    c.append(el('h3','',r.nom),el('p','',r.texte||''));
    z.append(c);
  });
}
let tourCourant=null;
async function envoyerAnnonce(){
  const joueur=$('f-joueur').value,texte=$('f-texte').value.trim(),msg=$('f-msg'),btn=$('f-send');
  if(!texte){msg.textContent='⚠️ Écris ton annonce d’abord.';return}
  btn.disabled=true;msg.textContent='Envoi…';
  const {error}=await db.from('annonces').insert({code_partie:partie,joueur:joueur,texte:texte,tour:tourCourant});
  btn.disabled=false;
  if(error){msg.textContent='❌ Envoi refusé : '+error.message;return}
  msg.textContent='✔ Annonce envoyée !';$('f-texte').value='';charger();
}
function setConn(ok){$('dot').className='dot'+(ok?' on':'');$('conn').textContent=ok?'en direct':'hors ligne'}

async function charger(){
  const e=await db.from('etat').select('*').eq('code_partie',partie).maybeSingle();
  const [p,j]=await Promise.all([
    db.from('pokemon').select('*').eq('code_partie',partie).order('id'),
    db.from('journal').select('*').eq('code_partie',partie).order('tour',{ascending:false}).limit(30)]);
  if(e.error||p.error||j.error){setConn(false);return}
  setConn(true);
  const a=e.data?await db.from('annonces').select('*').eq('code_partie',partie).eq('tour',e.data.tour):{data:[]};
  const list=p.data||[];
  tourCourant=e.data?e.data.tour:null;
  renderEtat(e.data);renderArena(list);renderEquipes(list);renderAnnonces(a.data||[]);renderJournal(j.data||[]);
  const pr=await db.from('personnages').select('*').eq('code_partie',partie).order('ordre');
  renderPersos(pr.error?[]:(pr.data||[]));
  list.forEach(x=>{prev[x.id]=pct(x)});
}

$('f-send').onclick=envoyerAnnonce;
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('on',x.id==='p-'+b.dataset.t));
});
function chargeLib(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.append(s)})}
async function demarrer(){
  if(!window.supabase){try{await chargeLib('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js')}catch(e){}}
  if(!window.supabase){try{await chargeLib('https://unpkg.com/@supabase/supabase-js@2.57.4/dist/umd/supabase.js')}catch(e){}}
  if(!window.supabase){
    $('phase').textContent='⚠️ Librairie de connexion non chargée';
    $('conn').textContent='hors ligne — ouvre la page via son adresse https (pas en fichier local) et vérifie ta connexion';
    return;
  }
  db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  charger();
  ['etat','pokemon','annonces','journal','personnages'].forEach(t=>{
    db.channel('jeu-'+t+'-'+partie).on('postgres_changes',{event:'*',schema:'public',table:t,filter:'code_partie=eq.'+partie},charger).subscribe();
  });
  setInterval(charger,10000);
}
demarrer();
